# Ternary tree from Prusinkiewicz and Lindenmayer,
# The Algorithmic Beauty of Plants, page 60, table 2.3.

tree:
  lsystem:
    free_params:
      - d1: 94.74  # divergence angle 1
      - d2: 132.63  # divergence angle 2
      - a: 18.95  # branching angle
      - lr: 1.109  # elongation rate
      - vr: 1.732  # width decrease rate

    axiom: N(1)F(200)/(45)A
    generations: 6 # n in the book
    tropism: [0, 0, -1.0] # The book said [0,-1,0] but is due to where the gravity is set
    bending: 0.22 # e in the book
    initial_angle: 30
    angle_std: 11.25

    rules:
      - pred: A
        succ: N(vr)F(50)[&(a)F(50)A]/(d1)[&(a)F(50)A$]/(d2)[&(a)F(50)A$]
      - pred: F(l)
        succ: F(l*lr)
      - pred: N(w)
        succ: N(w*vr)

    relative_std: 0.1

  scale:
    length: 0.0045
    radius: 0.0050

  fruits:
    count: 1

  outfile: trees/tree_{index:04d}.urdf

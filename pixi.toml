[workspace]
authors = ["nmarticorena <nicolas.marticorena.vidal@gmail.com>"]
channels = ["conda-forge"]
name = "tree-generator"
platforms = ["linux-64", "osx-arm64", { name = "gpu", platform = "linux-64", cuda = "12" }]
version = "0.1.0"

[tasks]

[dependencies]
python = "3.14.*"
ruff = ">=0.16.3,<0.17"
inquirerpy = ">=0.3.4,<0.4"
numpy = ">=2.5.2,<3"
pytorch = ">=2.13.0,<3"

[feature.gpu]
platforms = ["gpu"]

[feature.gpu.dependencies]
cuda-core = ">=1.1.0,<2"

[feature.gpu.pypi-dependencies]
nvidia-curobo = {git = "https://github.com/NVlabs/curobo.git"}

[environments]
gpu = ["gpu"]

[pypi-dependencies]
forsym = {path = ".", editable = true, extras = ["mujoco-warp","teleoperation"]}
urdf2mjcf = {git = "https://github.com/kscalelabs/urdf2mjcf.git"}
